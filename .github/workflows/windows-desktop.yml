name: Build Windows desktop app
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'mod/**', 'tests/mod.test.cjs', 'tests/run-mod-electron.mjs', 'tests/electron-fixture/**', 'tests/fixtures/**', 'global.json', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'mod/**', 'tests/mod.test.cjs', 'tests/run-mod-electron.mjs', 'tests/electron-fixture/**', 'tests/fixtures/**', 'global.json', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test app mod runtime
        run: node --test tests/mod.test.cjs
      - name: Test quota bar and build Windows app
        timeout-minutes: 10
        shell: pwsh
        run: ./desktop/Build-Windows.ps1
      - name: Verify packed mod in a real Electron test app
        shell: pwsh
        env:
          NODE_USE_ENV_PROXY: '1'
        run: |
          $env:PET_MOD_TOOLS = Join-Path $env:RUNNER_TEMP 'pet-plus-mod-tools'
          npm install --prefix $env:PET_MOD_TOOLS --no-audit --no-fund @electron/asar@4.3.1 electron@45.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Electron test tool installation failed.' }
          node (Join-Path $env:PET_MOD_TOOLS 'node_modules/electron/install.js')
          if ($LASTEXITCODE -ne 0) { throw 'Electron test runtime installation failed.' }
          node tests/run-mod-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packed mod smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: CodexPetPlus-Windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
