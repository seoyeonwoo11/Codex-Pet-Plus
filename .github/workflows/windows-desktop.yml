name: Build Windows desktop app
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'global.json', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'global.json', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and build self-contained Windows app
        shell: pwsh
        run: ./desktop/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexPetPlus-Windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
